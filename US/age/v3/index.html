<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Verify Access</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#7c3aed,#111827 62%);min-height:100vh;display:grid;place-items:center;padding:20px;color:white}.wrap{width:100%;max-width:440px;text-align:center}.panel{background:#0b1020;border-radius:30px;padding:30px 24px;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 90px rgba(0,0,0,.45)}.icon{font-size:44px;margin-bottom:10px}h1{font-size:29px;line-height:1.08;margin:0 0 12px}.sub{color:#c7d2fe;font-size:16px;line-height:1.45;margin:0 0 20px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border-radius:18px;padding:18px 12px;text-decoration:none;font-weight:900;font-size:17px}.yes{background:#a78bfa;color:#160b2f}.no{background:#1f2937;color:#e5e7eb}.fine{font-size:12px;color:#9ca3af;margin-top:18px}.pulse{animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.04)}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="icon pulse">🔒</div>
      <h1>Verify your age to continue</h1>
      <p class="sub">Quick confirmation required. Are you over 18?</p>
      <div class="choice">
        <a class="btn no" href="https://www.google.com/">No</a>
        <a class="btn yes" id="continueBtn" href="#">Yes</a>
      </div>
      <div class="fine">Only continue if you meet the legal age requirement.</div>
    </section>
  </main>
  <script>
    const p=new URLSearchParams(location.search);const target=p.get('click_url')||p.get('click')||p.get('to')||p.get('url')||'#';document.getElementById('continueBtn').href=target;
  </script>
</body>
</html>
