<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Eksklusif</title>
  <style>
    :root{--bg:#18203E;--accent:#FFB42D;--green:#32E000;--text:#FFFFFF;--dim:#CCCCCC}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:480px;margin:0 auto;padding:20px 16px 32px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:18px}
    h1{font-size:28px;line-height:1.2;margin:0 0 6px}
    .urgency{display:inline-block;background:var(--green);color:#0b1a00;font-weight:700;padding:6px 10px;border-radius:8px;font-size:13px}
    .sub{color:var(--dim);margin:10px 0 0;font-size:15px}
    ol{margin:0;padding-left:20px;display:grid;gap:8px}
    li{color:var(--text)}
    .cta{display:block;text-decoration:none;text-align:center;background:var(--accent);color:#1d1300;font-weight:800;padding:14px 16px;border-radius:10px;font-size:18px}
    .fine{font-size:12px;color:var(--dim);text-align:center}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Jawab kuis, menangkan hadiah</h1>
      <span class="urgency">Slot terbatas hari ini — aktifkan sekarang</span>
      <p class="sub">Selesaikan verifikasi cepat 3 langkah:</p>
      <ol>
        <li>Masukkan nomor HP</li>
        <li>Terima kode</li>
        <li>Masukkan kode</li>
      </ol>
    </section>
    <a class="cta" href="https://08deh.bemobtrk.com/click?campaign_id=93025f91-675d-4231-9fa9-4139e3ee358a&landing_id=a09aa287-da98-43d2-8d29-7cdb26532f16">LANJUTKAN</a>
    <div class="fine">Dengan menekan tombol, kamu setuju melanjutkan proses verifikasi operator.</div>
  </main>
</body>
</html>
