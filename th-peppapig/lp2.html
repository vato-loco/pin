<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win iPhone of Samsung</title>
  <style>
    :root{--pink:#FF5E9C;--yellow:#FFD23F;--text:#2C2C38}
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif;background:radial-gradient(circle at top,#ffe6f1 0%,#fff6cd 60%,#fff 100%);color:var(--text)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:22px 18px;border:2px solid #ffc7df;box-shadow:0 14px 35px rgba(255,94,156,.22)}
    .badge{display:inline-block;background:var(--yellow);padding:6px 10px;border-radius:999px;font-weight:700;font-size:12px;margin:0 auto 10px;display:block;text-align:center;max-width:190px}
    h1{margin:0 0 14px;text-align:center;font-size:27px;line-height:1.2;color:#d73475}
    .steps{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:10px}
    .steps li{display:flex;gap:10px;background:#fff8fc;border:1px solid #ffd8e9;border-radius:12px;padding:11px}
    .num{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font-weight:700}
    .cta{display:block;text-decoration:none;text-align:center;background:linear-gradient(180deg,#ff6ea6,#ff4f95);color:#fff;font-weight:800;font-size:19px;padding:15px;border-radius:14px;box-shadow:0 8px 18px rgba(255,94,156,.35)}
    .note{margin-top:12px;text-align:center;font-size:12px;color:#5f5f6a}
    @media (max-width:360px){h1{font-size:23px}.cta{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="badge">🐷 Peppa Pig Lucky Draw</div>
      <h1>Win een iPhone of Samsung — doe mee!</h1>
      <ul class="steps">
        <li><span class="num">1</span><div>Vul je <strong>telefoonnummer</strong> in</div></li>
        <li><span class="num">2</span><div>Ontvang een <strong>code per SMS</strong></div></li>
        <li><span class="num">3</span><div>Voer de code in om je deelname te <strong>bevestigen</strong></div></li>
      </ul>
      <a class="cta" href="https://nsecj.bid/cl/fd47ee5f5a96316f?p1={clickid}">DOE MEE &amp; BEVESTIG</a>
      <p class="note">TH DTAC gebruikers • PIN submit flow • abonnement</p>
    </section>
  </main>
</body>
</html>
