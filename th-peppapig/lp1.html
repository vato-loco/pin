<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peppa Pig Download พร้อมแล้ว</title>
  <style>
    :root{--pink:#FF5E9C;--yellow:#FFD23F;--text:#2E2E3A;--bg:#FFF7FB}
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif;background:linear-gradient(180deg,#ffe7f2 0%,#fff9dc 100%);color:var(--text)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 14px 35px rgba(255,94,156,.25);border:2px solid #ffd6e8}
    .brand{font-size:38px;text-align:center;line-height:1}
    h1{margin:10px 0 14px;text-align:center;font-size:26px;line-height:1.25;color:#d83476}
    .intro{text-align:center;font-size:15px;margin:0 0 14px}
    .steps{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:10px}
    .steps li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid #ffdbe9;border-radius:12px;padding:11px}
    .num{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font-weight:700}
    .cta{display:block;text-decoration:none;text-align:center;background:var(--pink);color:#fff;font-weight:700;font-size:19px;padding:15px;border-radius:14px;box-shadow:0 8px 18px rgba(255,94,156,.35)}
    .cta:active{transform:translateY(1px)}
    .note{margin-top:12px;text-align:center;font-size:12px;color:#5b5b66}
    .hl{background:var(--yellow);padding:1px 6px;border-radius:8px}
    @media (max-width:360px){h1{font-size:22px}.cta{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="brand">🐷🎮</div>
      <h1>Download staat klaar — bevestig je nummer</h1>
      <p class="intro">Nog <span class="hl">1 laatste stap</span> om je Peppa Pig download te openen.</p>
      <ul class="steps">
        <li><span class="num">1</span><div>Vul je <strong>telefoonnummer</strong> in</div></li>
        <li><span class="num">2</span><div>Ontvang een <strong>code per SMS</strong></div></li>
        <li><span class="num">3</span><div>Voer de code in om te <strong>bevestigen</strong></div></li>
      </ul>
      <a class="cta" href="https://08deh.bemobtrk.com/click?campaign_id=857eb45c-c440-4018-96ff-f20d4b53a70f&landing_id=d08b3a03-3d71-452e-99e2-d6e86bdec3f4">BEVESTIG NU</a>
      <p class="note">DTAC • TH • PIN bevestiging vereist (abonnement)</p>
    </section>
  </main>
</body>
</html>
