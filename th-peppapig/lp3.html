<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>วิดีโอและเกม Peppa Pig ฟรี</title>
  <style>
    :root{--pink:#FF5E9C;--yellow:#FFD23F;--text:#2c2f3a;--panel:#fff8fc}
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif;background:linear-gradient(180deg,#ffeaf4 0%,#fff8dc 100%);color:var(--text)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:22px 18px;border:2px solid #ffd2e6;box-shadow:0 14px 35px rgba(255,94,156,.24)}
    .hero{text-align:center;font-size:36px;line-height:1;margin-bottom:8px}
    h1{margin:0 0 14px;text-align:center;font-size:26px;line-height:1.25;color:#d53576}
    .sub{text-align:center;background:var(--panel);border:1px solid #ffd9ea;padding:10px;border-radius:12px;font-size:14px;margin-bottom:14px}
    .steps{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:10px}
    .steps li{display:flex;gap:10px;align-items:flex-start;background:#fffbfe;border:1px solid #ffdceb;border-radius:12px;padding:11px}
    .num{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font-weight:700}
    .cta{display:block;text-decoration:none;text-align:center;background:var(--pink);color:#fff;font-weight:800;font-size:19px;padding:15px;border-radius:14px;box-shadow:0 8px 18px rgba(255,94,156,.35)}
    .note{margin-top:12px;text-align:center;font-size:12px;color:#5d5f69}
    @media (max-width:360px){h1{font-size:22px}.cta{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="hero">🐷📺🧩</div>
      <h1>วิดีโอและเกม Peppa Pig ฟรี สำหรับลูกของคุณ</h1>
      <p class="sub">ปลดล็อกคอนเทนต์สำหรับเด็กด้วยการยืนยันอย่างรวดเร็ว</p>
      <ul class="steps">
        <li><span class="num">1</span><div>กรอก<strong>หมายเลขโทรศัพท์</strong>ของคุณ</div></li>
        <li><span class="num">2</span><div>รับ<strong>รหัสยืนยันทาง SMS</strong></div></li>
        <li><span class="num">3</span><div>กรอกรหัสเพื่อ<strong>ยืนยันการเข้าใช้งาน</strong></div></li>
      </ul>
      <a class="cta" href="https://08deh.bemobtrk.com/click?campaign_id=857eb45c-c440-4018-96ff-f20d4b53a70f&landing_id=2094ff09-fa64-4ead-97ce-006c7864cfea">ปลดล็อกคอนเทนต์ฟรี</a>
      <p class="note">DTAC ประเทศไทย • PIN submit • ยืนยันการสมัครบริการ</p>
    </section>
  </main>
</body>
</html>
