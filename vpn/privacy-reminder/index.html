<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #000;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* ========== Video Player ========== */
.video-player {
  position: relative;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 30% 20%, #1a1a2e 0%, #0a0a0a 100%);
  overflow: hidden;
}
.video-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #12122a 0%, #0a0a14 40%, #000 100%);
}
.video-bg-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.03)"/></svg>');
  background-size: 40px 40px;
}
.video-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.85) 100%);
}

/* ========== Modal ========== */
.modal-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 24px;
}
.modal {
  background: rgba(245, 245, 250, 0.93);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 30px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
  text-align: center;
  padding: 0;
  overflow: hidden;
  animation: modalIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9) translateY(24px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* Icon */
.modal-icon-wrap { padding: 34px 0 0 0; }
.modal-icon {
  width: 54px;
  height: 54px;
  background: linear-gradient(145deg, #5B9CF5 0%, #3B7DE0 100%);
  border-radius: 16px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(59, 125, 224, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
}
.modal-icon svg { width: 28px; height: 28px; }

/* Text */
.modal-label {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.7px;
  color: #6E6E7A;
  text-transform: uppercase;
  margin-top: 20px;
}
.modal-headline {
  font-size: 29px;
  font-weight: 700;
  color: #111118;
  line-height: 1.18;
  margin-top: 14px;
  padding: 0 18px;
}
.modal-body {
  font-size: 16px;
  font-weight: 400;
  color: #4A4A55;
  line-height: 1.5;
  margin-top: 14px;
  padding: 0 32px;
}

/* Divider */
.modal-divider {
  height: 1px;
  background: rgba(0, 0, 0, 0.07);
  margin: 26px 0 0 0;
}

/* CTA Button */
.modal-btn {
  display: block;
  width: 100%;
  padding: 18px 0;
  font-size: 18px;
  font-weight: 600;
  color: #007AFF;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  user-select: none;
  -webkit-touch-callout: none;
  transition: background 0.12s;
  letter-spacing: -0.1px;
}
.modal-btn:active {
  background: rgba(0, 122, 255, 0.05);
}

/* ========== Controls Bar ========== */
.controls-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 0 14px env(safe-area-inset-bottom, 10px) 14px;
  background: linear-gradient(0deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.45) 55%, transparent 100%);
  padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 6px);
}
.progress-row {
  display: flex;
  align-items: center;
  padding: 0 2px;
  margin-bottom: 10px;
  cursor: pointer;
}
.progress-track {
  flex: 1;
  height: 3px;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 2px;
  position: relative;
  transition: height 0.1s;
}
.progress-row:active .progress-track { height: 5px; }
.progress-fill {
  height: 100%;
  width: 34.6%;
  background: #FF0000;
  border-radius: 2px;
  position: relative;
  transition: width 0.1s;
}
.progress-thumb {
  position: absolute;
  right: -7px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  background: #FF0000;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.15s;
}
.progress-row:active .progress-thumb { opacity: 1; }
.controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.controls-left, .controls-right {
  display: flex;
  align-items: center;
  gap: 20px;
}
.ctrl-icon { width: 20px; height: 20px; opacity: 0.88; flex-shrink: 0; }
.timecode {
  color: #fff;
  font-size: 12.5px;
  font-weight: 400;
  opacity: 0.85;
  white-space: nowrap;
  letter-spacing: 0.2px;
}
.youtube-logo {
  display: flex;
  align-items: center;
  gap: 3px;
  opacity: 0.88;
}
.yt-icon-wrap {
  width: 24px;
  height: 17px;
  background: #fff;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.yt-icon-wrap svg { width: 13px; height: 9px; }
.yt-text {
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.2px;
}

/* Spacer for notch phones */
.controls-bar::before {
  content: '';
  display: block;
  height: 14px;
}

/* Responsive */
@media (max-width: 374px) {
  .modal { border-radius: 24px; }
  .modal-icon-wrap { padding: 28px 0 0 0; }
  .modal-icon { width: 46px; height: 46px; border-radius: 14px; }
  .modal-icon svg { width: 24px; height: 24px; }
  .modal-label { font-size: 11px; margin-top: 16px; }
  .modal-headline { font-size: 24px; padding: 0 14px; }
  .modal-body { font-size: 14px; padding: 0 22px; }
  .modal-btn { font-size: 16px; padding: 16px 0; }
  .controls-left, .controls-right { gap: 14px; }
}
@media (min-width: 768px) {
  .modal { max-width: 440px; }
  .controls-bar { padding: 0 32px 12px 32px; }
}
</style>
</head>
