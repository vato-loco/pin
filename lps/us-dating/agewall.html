<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Age Verification</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;overflow:hidden}
.wrap{text-align:center;padding:20px;max-width:400px;width:100%}
.logo{font-size:1.4rem;font-weight:700;color:#a855f7;margin-bottom:2rem;letter-spacing:1px}
.q{font-size:1.6rem;font-weight:700;margin-bottom:.5rem;line-height:1.3}
.sub{font-size:.85rem;color:#888;margin-bottom:2.5rem}
.btn-yes{display:block;width:100%;padding:1.1rem;margin-bottom:.8rem;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:14px;font-size:1.15rem;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn-yes:active{transform:scale(.96)}
.btn-no{display:block;width:100%;padding:1.1rem;background:transparent;color:#555;border:1px solid #333;border-radius:14px;font-size:1rem;cursor:pointer}
.btn-no:active{opacity:.7}
.timer{position:fixed;top:1rem;right:1rem;font-size:.7rem;color:#444}
.heart{font-size:2.5rem;margin-bottom:1.5rem}
</style>
</head>
<body>
<div class="timer" id="t"></div>
<div class="wrap">
<div class="heart">💜</div>
<div class="logo">PLAY CENTER</div>
<div class="q">Are you 18 or older?</div>
<div class="sub">You must be of legal age to continue</div>
<a href="{CLICK_URL}" class="btn-yes">Yes, I'm 18+</a>
<button class="btn-no" onclick="alert('You must be 18 or older to enter.')">No, I'm under 18</button>
</div>
<script>
var s=30,e=Date.now()+s*1e3,t=document.getElementById('t');
(function l(){var r=Math.max(0,Math.ceil((e-Date.now())/1e3));t.textContent='⏱ '+r+'s';if(r>0)setTimeout(l,1e3);else t.textContent=''})();
</script>
</body>
</html>
