<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kostenloser Zugang — Limitiertes Angebot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;overflow:hidden}
.wrap{text-align:center;padding:20px;max-width:420px;width:100%}
.logo{font-size:1.1rem;font-weight:700;color:#fbbf24;margin-bottom:1.5rem;letter-spacing:1px}
.card{background:linear-gradient(135deg,#1a1a1a,#0d0d0d);border:1px solid #fbbf2444;border-radius:20px;padding:1.8rem 1.2rem;margin-bottom:1.5rem}
.crown{font-size:3rem;margin-bottom:.8rem}
.badge{display:inline-block;background:#fbbf24;color:#000;font-size:.7rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;margin-bottom:1rem;letter-spacing:.5px}
.q{font-size:1.5rem;font-weight:800;margin-bottom:.4rem;line-height:1.3}
.price{font-size:.95rem;color:#888;margin-bottom:.3rem}
.price s{color:#666}
.free{font-size:2.2rem;font-weight:900;color:#fbbf24;margin-bottom:.3rem}
.sub{font-size:.82rem;color:#999;margin-bottom:1.2rem}
.countdown{font-size:1.8rem;font-weight:800;color:#fbbf24;margin-bottom:.3rem;font-variant-numeric:tabular-nums}
.timer-label{font-size:.75rem;color:#666;margin-bottom:1.2rem}
.timer-bar{width:100%;height:4px;background:#222;border-radius:2px;margin-bottom:1.5rem;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width 1s linear}
.btn{display:block;width:100%;padding:1.2rem;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;border:none;border-radius:14px;font-size:1.1rem;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}
.spots{font-size:.75rem;color:#555;margin-top:1rem}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">★ PLAY CENTER ★</div>
<div class="card">
<div class="crown">👑</div>
<div class="badge">LIMITIERTES ANGEBOT</div>
<div class="q">Kostenloser Zugang</div>
<div class="price">Normal <s>29,99€</s></div>
<div class="free">HEUTE KOSTENLOS</div>
<div class="sub">Premium-Dating-Zugang — keine Zahlung erforderlich</div>
<div class="countdown" id="cd">8:00</div>
<div class="timer-label">Angebot läuft ab in</div>
<div class="timer-bar"><div class="timer-fill" id="tf" style="width:100%"></div></div>
<a href="{CLICK_URL}" class="btn">Kostenlos sichern →</a>
<div class="spots">⚡ Nur noch 7 Plätze in Ihrer Region verfügbar</div>
</div>
</div>
<script>
var s=480,e=Date.now()+s*1e3,cd=document.getElementById('cd'),tf=document.getElementById('tf');
(function l(){var r=Math.max(0,e-Date.now()),m=Math.floor(r/6e4),sec=Math.floor(r%6e4/1e3);
cd.textContent=m+':'+(sec<10?'0':'')+sec;tf.style.width=(r/s*100)+'%';
if(r>0)setTimeout(l,200);else{cd.textContent='0:00';cd.style.color='#ef4444'}})();
</script>
</body>
</html>
