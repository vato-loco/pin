<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gameville - LP2</title>
  <style>
    :root{--bg:#152236;--accent:#223854;--btn:#FAB81E;--text:#F3F3F3;--dim:#7A89A6}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{width:min(92vw,420px);background:var(--accent);border-radius:16px;padding:24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    h1{margin:0 0 14px;font-size:1.7rem;line-height:1.3}
    .sub{color:var(--dim);margin:0 0 18px;font-size:1rem}
    .urgency{background:rgba(250,184,30,.1);border:1px solid rgba(250,184,30,.45);border-radius:10px;padding:10px 12px;margin:0 0 18px;color:#ffd66b;font-weight:700}
    .btn{display:block;text-decoration:none;background:var(--btn);color:#1b1b1b;font-weight:800;font-size:1.1rem;padding:15px 14px;border-radius:12px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Ontvang je GRATIS tegoed</h1>
    <p class="sub">Meld je aan en speel direct</p>
    <p class="urgency">nog <span id="slots">52</span> beschikbaar • <span id="timer">02:00</span></p>
    <a class="btn" href="https://nsecj.bid/cl/6552c346022eb081?p1={clickid}">CLAIM JE BONUS 🎁</a>
  </main>
<script>
  let time=120, slots=52;
  const timer=document.getElementById('timer');
  const slotsEl=document.getElementById('slots');
  setInterval(()=>{
    if(time>0) time--;
    const m=String(Math.floor(time/60)).padStart(2,'0');
    const s=String(time%60).padStart(2,'0');
    timer.textContent=`${m}:${s}`;
  },1000);
  setInterval(()=>{
    if(slots>15){slots-=Math.random()<.45?1:0;slotsEl.textContent=slots}
  },5000);
</script>
</body>
</html>
