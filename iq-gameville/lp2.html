<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GameVille — مكافأة مجانية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#152236;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#223854;border-radius:24px;padding:40px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)}
h1{color:#F3F3F3;font-size:26px;font-weight:800;line-height:1.3;margin-bottom:12px}
.sub{color:#7A89A6;font-size:15px;margin-bottom:24px}
.timer-wrap{background:#152236;border-radius:16px;padding:16px;margin-bottom:20px}
.timer{display:flex;justify-content:center;gap:12px}
.timer-item{display:flex;flex-direction:column;align-items:center}
.timer-item .num{color:#FAB81E;font-size:32px;font-weight:800;line-height:1}
.timer-item .lbl{color:#7A89A6;font-size:11px;margin-top:4px}
.timer-sep{color:#FAB81E;font-size:28px;font-weight:700;line-height:1;padding-top:2px}
.stock-bar{background:#152236;border-radius:10px;height:10px;overflow:hidden;margin-bottom:8px}
.stock-fill{background:linear-gradient(90deg,#FAB81E,#f5a623);height:100%;width:60%;border-radius:10px}
.stock-label{color:#7A89A6;font-size:13px;margin-bottom:24px}
.btn{display:block;width:100%;background:#FAB81E;color:#152236;font-size:20px;font-weight:800;padding:16px;border:none;border-radius:16px;cursor:pointer;text-decoration:none;text-align:center;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.legal{color:#7A89A6;font-size:11px;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>احصل على رصيدك المجاني</h1>
  <p class="sub">سجّل الآن وابدأ اللعب فورًا</p>

  <div class="timer-wrap">
    <div class="timer" id="timer">
      <div class="timer-item"><span class="num" id="min">01</span><span class="lbl">دقيقة</span></div>
      <span class="timer-sep">:</span>
      <div class="timer-item"><span class="num" id="sec">59</span><span class="lbl">ثانية</span></div>
    </div>
  </div>

  <div class="stock-bar"><div class="stock-fill"></div></div>
  <p class="stock-label">🎁 40 مكافأة متبقية — أسرع وانطلق!</p>

  <a class="btn" href="https://nsecj.bid/cl/6552c346022eb081?p1={clickid}" target="_blank" rel="noopener">احصل على مكافأتك 🎁</a>

  <p class="legal">بعد 3 أيام تجريبية — 300 دينار عراقي / اليوم · يمكنك الإلغاء في أي وقت</p>
</div>

<script>
(function(){
  var m=1,s=59;
  function tick(){
    if(m===0&&s===0){document.getElementById('min').textContent='00';document.getElementById('sec').textContent='00';return}
    if(s===0){m--;s=59}else{s--}
    document.getElementById('min').textContent=String(m).padStart(2,'0');
    document.getElementById('sec').textContent=String(s).padStart(2,'0');
  }
  setInterval(tick,1000);
})();
</script>
</body>
</html>
