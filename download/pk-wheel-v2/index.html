<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Big Pakistan!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b1a2d; color: white; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 14px; margin-top: 0; opacity: 0.9; }
        
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 30px auto; }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 30px; height: 40px; background-color: #ffd700; clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 10; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
        
        #wheel { width: 100%; height: 100%; border-radius: 50%; border: 10px solid #ffd700; position: relative; transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1); overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        .segment { position: absolute; width: 100%; height: 100%; clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%); transform-origin: 50% 50%; display: flex; align-items: center; justify-content: center; }
        
        /* Prijsteksten op het rad */
        .segment span { position: absolute; top: 40px; left: 70%; transform: rotate(65deg); font-weight: bold; font-size: 14px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); width: 100px; text-align: center; }

        .spin-button { background-color: #ffd700; color: #0b1a2d; border: none; padding: 15px 50px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4); margin-top: 20px; transition: 0.2s; }
        .spin-button:active { transform: scale(0.95); }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .congrats-card { background: #162a44; padding: 30px; border-radius: 20px; border: 2px solid #ffd700; max-width: 350px; box-shadow: 0 0 50px rgba(255, 215, 0, 0.3); }
        .prize-text { color: #ffd700; font-size: 32px; font-weight: bold; margin: 15px 0; display: block; }
        .cta-button { display: block; background-color: #2ecc71; color: white; text-decoration: none; padding: 18px 30px; font-size: 22px; font-weight: bold; border-radius: 10px; margin-top: 20px; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(46, 204, 113, 0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>LUCKY SPIN PAKISTAN 🇵🇰</h1>
        <p>You have <strong>1 FREE SPIN</strong> remaining!</p>
    </div>

    <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <div id="wheel">
            <div class="segment" style="transform: rotate(0deg); background: #e74c3c;"><span>1,000 PKR</span></div>
            <div class="segment" style="transform: rotate(45deg); background: #3498db;"><span>5,000 PKR</span></div>
            <div class="segment" style="transform: rotate(90deg); background: #f1c40f;"><span>500 PKR</span></div>
            <div class="segment" style="transform: rotate(135deg); background: #2ecc71;"><span style="font-size: 16px;">100,000!</span></div>
            <div class="segment" style="transform: rotate(180deg); background: #9b59b6;"><span>10,000 PKR</span></div>
            <div class="segment" style="transform: rotate(225deg); background: #e67e22;"><span>TRY AGAIN</span></div>
            <div class="segment" style="transform: rotate(270deg); background: #1abc9c;"><span>2,500 PKR</span></div>
            <div class="segment" style="transform: rotate(315deg); background: #34495e;"><span>250 PKR</span></div>
        </div>
    </div>

    <button id="spinBtn" class="spin-button" onclick="spinWheel()">SPIN NOW</button>

    <div id="overlay" class="overlay">
        <div class="congrats-card">
            <h2 style="color: #ffd700; margin-top: 0;">JACKPOT! 🎉</h2>
            <p>You have won the grand prize:</p>
            <span class="prize-text">100,000 PKR</span>
            <p>Claim your winnings before the timer expires!</p>
            <a href="https://08deh.bemobtrk.com/click" class="cta-button">CLAIM NOW</a>
            <p style="font-size: 13px; margin-top: 20px; color: #ff4d4d; font-weight: bold;">Expires in: <span id="timer">02:59</span></p>
        </div>
    </div>

    <script>
        function spinWheel() {
            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('spinBtn');
            btn.style.visibility = 'hidden';
            
            // We willen stoppen op het segment van 100,000 PKR (135 graden op de cirkel)
            // Het rad draait met de klok mee. Om 135 graden bij de pointer (top/0 graden) te krijgen:
            // We draaien een aantal keer rond + de offset.
            const totalRotation = 3600 + (360 - 135) - 22.5; 
            wheel.style.transform = "rotate(" + totalRotation + "deg)";
            
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'flex';
                startTimer();
            }, 5500);
        }

        function startTimer() {
            let time = 179;
            const timerElement = document.getElementById('timer');
            const interval = setInterval(() => {
                let m = Math.floor(time / 60);
                let s = time % 60;
                timerElement.innerText = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
                if (time <= 0) clearInterval(interval);
                time--;
            }, 1000);
        }
    </script>
</body>
</html>
