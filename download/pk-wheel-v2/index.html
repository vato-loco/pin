<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Big Pakistan!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b1a2d; color: white; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        .header h1 { font-size: 26px; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .header p { font-size: 14px; margin-top: 0; opacity: 0.9; }

        .wheel-container { position: relative; width: 340px; height: 340px; margin: 30px auto; }
        .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 40px; height: 50px; background-color: #ffd700; clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 20; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
        
        #wheel-svg { width: 100%; height: 100%; transform: rotate(0deg); transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1); filter: drop-shadow(0 0 20px rgba(0,0,0,0.5)); }
        
        .spin-button { background-color: #ffd700; color: #0b1a2d; border: none; padding: 18px 60px; font-size: 22px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4); margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 100; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .congrats-card { background: linear-gradient(145deg, #162a44, #0b1a2d); padding: 40px 30px; border-radius: 25px; border: 3px solid #ffd700; max-width: 380px; box-shadow: 0 0 60px rgba(255, 215, 0, 0.4); }
        .prize-text { color: #ffd700; font-size: 38px; font-weight: bold; margin: 20px 0; display: block; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        .cta-button { display: block; background-color: #2ecc71; color: white; text-decoration: none; padding: 20px 30px; font-size: 24px; font-weight: bold; border-radius: 12px; margin-top: 25px; animation: pulse 1.5s infinite; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4); }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
        #timer { color: #ff4d4d; font-weight: 700; font-size: 18px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>LUCKY SPIN PAKISTAN 🇵🇰</h1>
        <p>You have <strong>1 FREE SPIN</strong> remaining!</p>
    </div>

    <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <svg id="wheel-svg" viewBox="0 0 100 100">
            <g id="wheel-group">
                <!-- Segmenten (8 stuks) -->
                <path d="M 50 50 L 50 0 A 50 50 0 0 1 85.35 14.65 Z" fill="#e74c3c" />
                <path d="M 50 50 L 85.35 14.65 A 50 50 0 0 1 100 50 Z" fill="#3498db" />
                <path d="M 50 50 L 100 50 A 50 50 0 0 1 85.35 85.35 Z" fill="#f1c40f" />
                <path d="M 50 50 L 85.35 85.35 A 50 50 0 0 1 50 100 Z" fill="#2ecc71" />
                <path d="M 50 50 L 50 100 A 50 50 0 0 1 14.65 85.35 Z" fill="#9b59b6" />
                <path d="M 50 50 L 14.65 85.35 A 50 50 0 0 1 0 50 Z" fill="#e67e22" />
                <path d="M 50 50 L 0 50 A 50 50 0 0 1 14.65 14.65 Z" fill="#1abc9c" />
                <path d="M 50 50 L 14.65 14.65 A 50 50 0 0 1 50 0 Z" fill="#34495e" />

                <!-- Tekst labels in de segmenten -->
                <g fill="white" font-size="3.5" font-weight="bold" text-anchor="middle">
                    <text transform="translate(62 25) rotate(22.5)">1,000 PKR</text>
                    <text transform="translate(80 40) rotate(67.5)">5,000 PKR</text>
                    <text transform="translate(82 65) rotate(112.5)">500 PKR</text>
                    <text transform="translate(65 82) rotate(157.5)">100,000!</text>
                    <text transform="translate(38 82) rotate(202.5)">10,000 PKR</text>
                    <text transform="translate(18 65) rotate(247.5)">TRY AGAIN</text>
                    <text transform="translate(18 35) rotate(292.5)">2,500 PKR</text>
                    <text transform="translate(38 18) rotate(337.5)">250 PKR</text>
                </g>
                
                <!-- Buitenrand -->
                <circle cx="50" cy="50" r="49" fill="none" stroke="#ffd700" stroke-width="2" />
                <!-- Middelpunt -->
                <circle cx="50" cy="50" r="4" fill="#ffd700" />
            </g>
        </svg>
    </div>

    <button id="spinBtn" class="spin-button" onclick="spinWheel()">SPIN NOW</button>

    <div id="overlay" class="overlay">
        <div class="congrats-card">
            <h2 style="color: #ffd700; margin-top: 0;">JACKPOT! 🎉</h2>
            <p style="font-size: 18px;">You have won the grand prize:</p>
            <span class="prize-text">100,000 PKR</span>
            <p>Verification is required to claim your prize.</p>
            <a href="https://08deh.bemobtrk.com/click" class="cta-button">CLAIM NOW</a>
            <p style="margin-top: 25px; opacity: 0.8;">Offer expires in: <span id="timer">02:59</span></p>
        </div>
    </div>

    <script>
        function spinWheel() {
            const wheel = document.getElementById('wheel-svg');
            const btn = document.getElementById('spinBtn');
            btn.style.visibility = 'hidden';
            
            // Stoppen op 100,000! (Ligt op 157.5 graden in de SVG)
            // Om 157.5 graden bovenaan bij de pointer (0 graden) te krijgen:
            const stopAngle = 3600 + (360 - 157.5); 
            wheel.style.transform = "rotate(" + stopAngle + "deg)";
            
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'flex';
                startTimer();
            }, 5500);
        }

        function startTimer() {
            let time = 179;
            const timerElement = document.getElementById('timer');
            const interval = setInterval(() => {
                let m = Math.floor(time / 60);
                let s = time % 60;
                timerElement.innerText = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
                if (time <= 0) clearInterval(interval);
                time--;
            }, 1000);
        }
    </script>
</body>
</html>
