<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>جاري معالجة التحميل...</title>
<style>
  :root {
    --red: #e60000;
    --blue: #2d83b7;
    --bg: #ffffff;
    --border: #d1d1d1;
    --text: #333333;
  }
  body {
    background: var(--bg);
    font-family: "Cairo", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: var(--text);
    direction: rtl;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 370px;
    text-align: center;
    padding: 25px 30px 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 18px;
    color: var(--red);
    font-weight: 700;
  }
  .progress-wrap {
    background: #e3edf5;
    border-radius: 6px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .progress {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 3px;
  }
  .progress span {
    height: 16px;
    background: var(--blue);
    border-radius: 3px;
    opacity: 0.25;
    animation: load 1.3s linear infinite;
  }
  @keyframes load {
    0% { opacity: 0.25; }
    40% { opacity: 1; }
    100% { opacity: 0.25; }
  }
  .progress span:nth-child(n) { animation-delay: calc(var(--i) * 0.1s); }
  .progress span:nth-child(1) { --i: 0; }
  .progress span:nth-child(2) { --i: 1; }
  .progress span:nth-child(3) { --i: 2; }
  .progress span:nth-child(4) { --i: 3; }
  .progress span:nth-child(5) { --i: 4; }
  .progress span:nth-child(6) { --i: 5; }
  .progress span:nth-child(7) { --i: 6; }
  .progress span:nth-child(8) { --i: 7; }
  .progress span:nth-child(9) { --i: 8; }
  .progress span:nth-child(10) { --i: 9; }
  .progress span:nth-child(11) { --i: 10; }
  .progress span:nth-child(12) { --i: 11; }
  .progress span:nth-child(13) { --i: 12; }

  p {
    margin: 0 0 10px;
    font-size: 15px;
  }
  .highlight {
    font-weight: bold;
    color: #000;
  }
  a.btn {
    display: inline-block;
    background: var(--red);
    color: #fff;
    text-decoration: none;
    padding: 10px 40px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    margin: 15px 0 8px;
  }
  .timer {
    font-size: 14px;
    color: #000;
  }
  .timer span {
    color: var(--red);
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>جاري معالجة التحميل...</h1>
    <div class="progress-wrap">
      <div class="progress">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span>
      </div>
    </div>
    <p>إذا لم يبدأ التحميل تلقائيًا،</p>
    <p class="highlight">انقر على زر "موافق" لإكمال التحميل</p>
    <a class="btn" href="https://08deh.bemobtrk.com/click">موافق</a>
    <div class="timer">صالح لمدة: <span id="counter">5</span> ثوانٍ</div>
  </div>
  <script>
    let counter = 5;
    const el = document.getElementById("counter");
    const timer = setInterval(() => {
      counter--;
      if (counter <= 0) { counter = 0; clearInterval(timer); }
      el.textContent = counter;
    }, 1000);
  </script>
</body>
</html>
