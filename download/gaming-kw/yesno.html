<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>هل تريد تجربة الألعاب السحابية؟</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --neon:#00ff88;
    --blue:#00cfff;
    --bg:#0a0a0f;
    --card:#12121a;
    --border:#1e1e2e;
    --text:#f0f0f0;
    --muted:#8888aa;
    --cta:#00ff88;
    --cta-glow:rgba(0,255,136,0.35);
  }
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;text-align:center;
    background-image:radial-gradient(ellipse at top,rgba(0,255,136,0.06) 0%,transparent 70%);
  }
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:40px 30px;max-width:400px;width:100%;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--neon),var(--blue));
  }
  .icon{font-size:64px;margin-bottom:16px;display:block;}
  h1{
    font-size:24px;font-weight:700;line-height:1.4;margin-bottom:12px;
    background:linear-gradient(135deg,var(--neon),var(--blue));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  p{font-size:15px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
  .carriers{
    display:flex;justify-content:center;gap:8px;margin:16px 0 28px;flex-wrap:wrap;
  }
  .carrier{
    background:rgba(255,255,255,0.05);border:1px solid var(--border);
    border-radius:8px;padding:6px 14px;font-size:12px;color:var(--muted);
  }
  .btn-group{display:flex;flex-direction:column;gap:12px;}
  .btn-yes{
    display:flex;align-items:center;justify-content:center;
    background:var(--neon);color:#0a0a0f;font-size:18px;font-weight:700;
    padding:16px 24px;border-radius:12px;border:none;cursor:pointer;
    text-decoration:none;transition:all .2s;
    box-shadow:0 0 20px var(--cta-glow);
  }
  .btn-yes:active{transform:scale(0.97);}
  .btn-no{
    display:flex;align-items:center;justify-content:center;
    background:transparent;color:var(--muted);font-size:15px;
    padding:12px 24px;border-radius:12px;border:1px solid var(--border);
    cursor:pointer;text-decoration:none;transition:all .2s;
  }
  .btn-no:active{background:rgba(255,255,255,0.05);}
  .countdown{font-size:13px;color:var(--muted);margin:24px 0 0;opacity:0.7;}
  .countdown span{color:var(--neon);font-weight:600;}
  .footer{margin-top:16px;font-size:11px;color:var(--muted);opacity:0.5;}
  .footer a{color:var(--muted);text-decoration:underline;}
</style>
</head>
<body>

<div class="card">
  <span class="icon">🎮</span>
  <h1>هل تريد تجربة الألعاب السحابية؟</h1>
  <p>العب أكثر من 500 لعبة على هاتفك مباشرة.<br>بدون تحميل، بدون جهاز قوي.</p>

  <div class="carriers">
    <span class="carrier">Zain</span>
    <span class="carrier">Ooredoo</span>
    <span class="carrier">STC</span>
  </div>

  <div class="btn-group">
    <a href="https://08deh.bemobtrk.com/click" class="btn-yes">نعم، جرب الآن</a>
    <a href="#" onclick="event.preventDefault();this.textContent='فكر في الأمر...';this.style.opacity='0.4';" class="btn-no">لا، شكراً</a>
  </div>

  <div class="countdown">
    العرض ينتهي في <span id="timer">02:00:00</span>
  </div>
</div>

<div class="footer">
  <a href="#">الشروط والأحكام</a> • <a href="#">الخصوصية</a>
</div>

<script>
(function(){
  var h=2+Math.floor(Math.random()),m=Math.floor(Math.random()*60),s=Math.floor(Math.random()*60);
  function upd(){
    var el=document.getElementById('timer');
    if(!el)return;
    if(h<=0&&m<=0&&s<=0){el.textContent='00:00:00';return;}
    if(s<=0){s=59;if(m<=0){m=59;h--;}else m--;}else s--;
    el.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  setInterval(upd,1000);
})();
</script>

</body>
</html>
