<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 14 Giveaway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
    <style>*{ -webkit-tap-highlight-color:transparent; }</style>
</head>
<body class="bg-gradient-to-b from-purple-50 to-purple-100 min-h-screen font-sans flex items-center justify-center p-4">
    <div class="w-full max-w-sm text-center">
        <!-- iPhone visual -->
        <div class="w-24 h-24 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
        </div>

        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">You might have won!</h1>
        <p class="text-gray-500 text-base mb-4">Check if you're today's lucky winner</p>

        <!-- Trust badge -->
        <div class="flex items-center justify-center gap-1.5 mb-6 text-green-600">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            <span class="text-xs font-semibold">Verified giveaway</span>
        </div>

        <a href="https://08deh.bemobtrk.com/click"
           class="block w-full bg-purple-600 active:bg-purple-800 text-white font-bold text-xl py-5 rounded-2xl shadow-lg shadow-purple-200 transition-all no-underline">
            Check Now
        </a>

        <p class="text-xs text-gray-400 mt-6">Free to enter. No purchase needed.</p>
    </div>
</body>
</html>
