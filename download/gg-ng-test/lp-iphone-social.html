<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 14 Winners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
    <style>
        *{ -webkit-tap-highlight-color:transparent; }
        @keyframes pulse-dot{ 0%,100%{opacity:1} 50%{opacity:.4} }
        .live-dot{animation:pulse-dot 1.5s ease-in-out infinite}
    </style>
</head>
<body class="bg-gradient-to-b from-purple-50 to-purple-100 min-h-screen font-sans flex items-center justify-center p-4">
    <div class="w-full max-w-sm text-center">
        <!-- Live indicator -->
        <div class="flex items-center justify-center gap-2 mb-4">
            <span class="live-dot w-3 h-3 bg-purple-500 rounded-full inline-block"></span>
            <span class="text-sm font-semibold text-purple-600 uppercase tracking-wide">LIVE — active now</span>
        </div>

        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">iPhone 14 Winners</h1>

        <div class="bg-white rounded-2xl shadow-lg p-6 my-6">
            <div class="text-5xl font-extrabold text-purple-600 mb-1">3</div>
            <div class="text-gray-500 text-sm mb-4">winners today in Nigeria</div>

            <div class="space-y-2 text-left">
                <div class="flex items-center gap-3 bg-green-50 p-3 rounded-xl">
                    <span class="text-2xl">🎉</span>
                    <div><span class="font-bold">Chidera O.</span><br><span class="text-xs text-gray-500">Won in Lagos • 2 hours ago</span></div>
                </div>
                <div class="flex items-center gap-3 bg-green-50 p-3 rounded-xl">
                    <span class="text-2xl">🎉</span>
                    <div><span class="font-bold">Kofi A.</span><br><span class="text-xs text-gray-500">Won in Abuja • 5 hours ago</span></div>
                </div>
                <div class="flex items-center gap-3 bg-green-50 p-3 rounded-xl">
                    <span class="text-2xl">🎉</span>
                    <div><span class="font-bold">Amara E.</span><br><span class="text-xs text-gray-500">Won in Port Harcourt • today</span></div>
                </div>
            </div>
        </div>

        <a href="https://08deh.bemobtrk.com/click?campaign_id=ecce3d4e-5f0f-4be9-bac5-c0d12b7815ce&landing_id=982d016a-e411-4f55-be41-1957f1973251"
           class="block w-full bg-purple-600 active:bg-purple-800 text-white font-bold text-xl py-5 rounded-2xl shadow-lg shadow-purple-200 transition-all no-underline">
            Check If You Won
        </a>

        <p class="text-xs text-gray-400 mt-6">12 winners this week. Next winner could be you.</p>
    </div>
</body>
</html>
