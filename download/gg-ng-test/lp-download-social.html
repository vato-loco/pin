<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Download Now</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
    <style>
        *{ -webkit-tap-highlight-color:transparent; }
        @keyframes pulse-dot{ 0%,100%{opacity:1} 50%{opacity:.4} }
        .live-dot{animation:pulse-dot 1.5s ease-in-out infinite}
        @keyframes pop{ 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
        .count-pop{animation:pop .5s ease-out}
    </style>
</head>
<body class="bg-gradient-to-b from-green-50 to-green-100 min-h-screen font-sans flex items-center justify-center p-4">
    <div class="w-full max-w-sm text-center">
        <!-- Live indicator -->
        <div class="flex items-center justify-center gap-2 mb-4">
            <span class="live-dot w-3 h-3 bg-green-500 rounded-full inline-block"></span>
            <span class="text-sm font-semibold text-green-600 uppercase tracking-wide">LIVE — active now</span>
        </div>

        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Get the download</h1>

        <!-- Big stat -->
        <div class="bg-white rounded-2xl shadow-lg p-6 my-6">
            <div class="text-5xl font-extrabold text-green-600 mb-1 count-pop">1,284</div>
            <div class="text-gray-500 text-sm">people downloaded today</div>
        </div>

        <div class="bg-orange-50 text-orange-700 text-sm font-semibold py-2 px-4 rounded-xl inline-block mb-6">
            🔥 53 people downloading right now
        </div>

        <a href="https://08deh.bemobtrk.com/click?campaign_id=c2962fdc-aa4d-4a3a-a9b5-b44bfe9076cf&landing_id=d9d1f173-ec76-495c-888d-ddcfb319ec23"
           class="block w-full bg-green-600 active:bg-green-800 text-white font-bold text-xl py-5 rounded-2xl shadow-lg shadow-green-200 transition-all no-underline">
            Download Now
        </a>

        <p class="text-xs text-gray-400 mt-6">Free download. Data rates may apply.</p>
    </div>
</body>
</html>
