<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BatteryBoost – +40% Battery Life</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:20px;width:100%;max-width:400px;max-height:580px;padding:28px 22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
  .hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .icon-wrap{width:56px;height:56px;background:#e8f5e9;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
  .app-name{font-size:20px;font-weight:800;color:#1b1b1b;letter-spacing:-.3px}
  .benefit{font-size:14px;color:#444;font-weight:500}
  .stats{display:flex;gap:14px;justify-content:center;margin-top:2px}
  .stat{background:#f1f8e9;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;color:#2e7d32}
  .visual{height:72px;background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 100%);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden}
  .bat-bar{display:flex;align-items:flex-end;gap:3px;height:48px}
  .bar{width:8px;border-radius:4px 4px 0 0;background:#4caf50}
  .bar.b1{height:20px;opacity:.4}
  .bar.b2{height:32px;opacity:.6}
  .bar.b3{height:44px;opacity:.8}
  .bar.b4{height:48px}
  .vs{font-size:11px;font-weight:700;color:#555;padding:0 4px}
  .bat-icon{font-size:36px}
  .pct{font-size:22px;font-weight:900;color:#2e7d32}
  .cta{display:block;background:#2e7d32;color:#fff;text-align:center;text-decoration:none;font-size:18px;font-weight:800;padding:16px;border-radius:14px;letter-spacing:.2px;box-shadow:0 4px 16px rgba(46,125,50,.4)}
  .cta:active{transform:scale(.98)}
  .trust{text-align:center;font-size:11px;color:#777;font-weight:600}
  .footer{text-align:center;font-size:10px;color:#aaa}
  .footer a{color:#aaa;text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <div class="icon-wrap">🔋</div>
    <div class="app-name">BatteryBoost</div>
    <div class="benefit">Extend your battery by <strong>+40%</strong> — instantly</div>
    <div class="stats">
      <div class="stat">⭐ 4.8 Rating</div>
      <div class="stat">2M+ Users</div>
    </div>
  </div>

  <div class="visual">
    <div class="bat-bar">
      <div class="bar b1"></div>
      <div class="bar b2"></div>
      <div class="bar b3"></div>
      <div class="bar b4"></div>
    </div>
    <div class="vs">BEFORE<br>vs<br>AFTER</div>
    <div>
      <div class="bat-icon">🔋</div>
      <div class="pct">+40%</div>
    </div>
  </div>

  <a class="cta" href="https://08deh.bemobtrk.com/click">⚡ Boost My Battery Now</a>

  <div class="trust">🔒 Safe · No data collected · Free</div>
  <div class="footer">
    <a href="#">Terms</a>·<a href="#">Privacy</a>
  </div>
</div>
</body>
</html>
