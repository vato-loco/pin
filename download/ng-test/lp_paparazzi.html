<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking News NG</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .header { background: #ff0000; color: white; padding: 10px; font-weight: bold; text-align: center; }
        .content { padding: 20px; text-align: center; }
        .headline { font-size: 1.5em; font-weight: bold; color: #111; }
        .video-thumb { background: #000; width: 100%; height: 200px; margin: 20px 0; position: relative; }
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 50px; cursor: pointer; }
        .btn { display: inline-block; background: #ff0000; color: white; padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">🔥 BREAKING NEWS NIGERIA</div>
    <div class="content">
        <div class="headline">"Viral: What this celebrity did at the club last night shocked everyone!"</div>
        <div class="video-thumb">
            <span class="play-btn">▶️</span>
        </div>
        <p>The video has been removed from social media, watch the mirror here before it's gone!</p>
        <a href="{offer_url}" class="btn">WATCH FULL VIDEO</a>
    </div>
</body>
</html>
