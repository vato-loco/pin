<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NetBoost – 3x Faster Connection</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d1b2a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:20px;width:100%;max-width:400px;max-height:580px;padding:28px 22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
  .hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .icon-wrap{width:56px;height:56px;background:#e3f2fd;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
  .app-name{font-size:20px;font-weight:800;color:#1b1b1b;letter-spacing:-.3px}
  .benefit{font-size:14px;color:#444;font-weight:500}
  .stats{display:flex;gap:14px;justify-content:center;margin-top:2px}
  .stat{background:#e3f2fd;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;color:#1565c0}
  .visual{height:72px;background:linear-gradient(135deg,#e3f2fd 0%,#bbdefb 100%);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:20px;overflow:hidden;padding:0 16px}
  .speed-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
  .speed-label{font-size:10px;font-weight:600;color:#666;text-transform:uppercase}
  .speed-val{font-size:20px;font-weight:900}
  .speed-val.slow{color:#e53935}
  .speed-val.fast{color:#1565c0}
  .arrow{font-size:24px;color:#1565c0}
  .badge{background:#1565c0;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800}
  .cta{display:block;background:#1565c0;color:#fff;text-align:center;text-decoration:none;font-size:18px;font-weight:800;padding:16px;border-radius:14px;letter-spacing:.2px;box-shadow:0 4px 16px rgba(21,101,192,.4)}
  .cta:active{transform:scale(.98)}
  .trust{text-align:center;font-size:11px;color:#777;font-weight:600}
  .footer{text-align:center;font-size:10px;color:#aaa}
  .footer a{color:#aaa;text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <div class="icon-wrap">📶</div>
    <div class="app-name">NetBoost</div>
    <div class="benefit">Get <strong>3x Faster</strong> connection in seconds</div>
    <div class="stats">
      <div class="stat">⭐ 4.9 Rating</div>
      <div class="stat">3M+ Users</div>
    </div>
  </div>

  <div class="visual">
    <div class="speed-wrap">
      <div class="speed-label">Before</div>
      <div class="speed-val slow">2 Mbps</div>
    </div>
    <div class="arrow">→</div>
    <div class="speed-wrap">
      <div class="speed-label">After</div>
      <div class="speed-val fast">6 Mbps</div>
    </div>
    <div class="badge">3× FASTER</div>
  </div>

  <a class="cta" href="https://08deh.bemobtrk.com/click">🚀 Speed Up My Connection</a>

  <div class="trust">🔒 Safe · No data collected · Free</div>
  <div class="footer">
    <a href="#">Terms</a>·<a href="#">Privacy</a>
  </div>
</div>
</body>
</html>
