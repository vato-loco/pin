<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rocket Download — Música Gratis</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d0d1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center}
  .card{background:#1a1a2e;border-radius:24px;width:100%;max-width:400px;padding:32px 24px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 40px rgba(120,40,200,.25);border:1px solid rgba(120,40,200,.15)}
  .hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .icon-wrap{width:64px;height:64px;background:linear-gradient(135deg,#7b2ff7,#c44bff);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px}
  .app-name{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
  .tagline{font-size:14px;color:#a0a0c0;font-weight:500;max-width:280px}
  .features{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .feat{background:rgba(120,40,200,.12);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;color:#c44bff}
  .visual{height:80px;background:linear-gradient(135deg,rgba(123,47,247,.2),rgba(196,75,255,.1));border-radius:14px;display:flex;align-items:center;justify-content:center;gap:12px}
  .music-note{font-size:36px}
  .eq-bars{display:flex;align-items:flex-end;gap:3px;height:36px}
  .eq{width:5px;border-radius:3px;background:linear-gradient(180deg,#c44bff,#7b2ff7)}
  .eq.e1{height:14px;animation:pulse .8s ease-in-out infinite}.eq.e2{height:26px;animation:pulse .8s ease-in-out .2s infinite}.eq.e3{height:36px;animation:pulse .8s ease-in-out .4s infinite}.eq.e4{height:20px;animation:pulse .8s ease-in-out .6s infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .cta{display:block;background:linear-gradient(135deg,#7b2ff7,#c44bff);color:#fff;text-align:center;text-decoration:none;font-size:18px;font-weight:700;padding:16px;border-radius:14px;letter-spacing:.3px;box-shadow:0 4px 20px rgba(123,47,247,.4)}
  .cta:active{transform:scale(.98)}
  .trust{text-align:center;font-size:11px;color:#666}
  .footer{text-align:center;font-size:10px;color:#444}
  .footer a{color:#444;text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <div class="icon-wrap">🚀</div>
    <div class="app-name">Rocket Download</div>
    <div class="tagline">Música ilimitada gratis para tu móvil</div>
    <div class="features">
      <div class="feat">🎵 MP3 Ilimitado</div>
      <div class="feat">⚡ Descarga Rápida</div>
      <div class="feat">🔓 Sin Registro</div>
    </div>
  </div>

  <div class="visual">
    <div class="music-note">🎶</div>
    <div class="eq-bars">
      <div class="eq e1"></div><div class="eq e2"></div><div class="eq e3"></div><div class="eq e4"></div>
    </div>
    <div class="music-note">🎵</div>
  </div>

  <a class="cta" href="https://08deh.bemobtrk.com/click">🚀 Descargar Ahora</a>

  <div class="trust">🔒 Seguro · Sin recolección de datos · Gratis</div>
  <div class="footer">
    <a href="#">Términos</a>·<a href="#">Privacidad</a>
  </div>
</div>
</body>
</html>
