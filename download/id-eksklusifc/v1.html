<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akses Eksklusif</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0d1b2a 0%,#1b2838 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;border-radius:16px;max-width:380px;width:100%;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.3)}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:24px 20px;text-align:center}
.header .icon{font-size:42px;margin-bottom:8px}
.header h1{color:#fff;font-size:20px;font-weight:700;margin-bottom:4px}
.header p{color:rgba(255,255,255,0.7);font-size:13px}
.body{padding:20px}
.benefits{list-style:none;margin:15px 0}
.benefits li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;color:#333}
.benefits li:last-child{border-bottom:none}
.benefits .check{color:#27ae60;font-size:18px;font-weight:700;flex-shrink:0}
.cta{display:block;background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;text-decoration:none;padding:16px;border-radius:12px;font-size:16px;font-weight:700;text-align:center;margin:15px 0 5px;box-shadow:0 4px 15px rgba(243,156,18,0.4);transition:transform 0.2s}
.cta:active{transform:scale(0.98)}
.note{text-align:center;font-size:11px;color:#999;margin-top:8px}
.footer{text-align:center;font-size:10px;color:#bbb;padding:0 20px 20px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="icon">🔒</div>
    <h1>Konten Eksklusif</h1>
    <p>Akses premium — hanya untuk member</p>
  </div>
  <div class="body">
    <ul class="benefits">
      <li><span class="check">✓</span> Konten original tanpa batas</li>
      <li><span class="check">✓</span> Update harian konten baru</li>
      <li><span class="check">✓</span> Tanpa iklan mengganggu</li>
      <li><span class="check">✓</span> Bisa diakses 24/7</li>
    </ul>
    <a href="https://08deh.bemobtrk.com/click" class="cta">AKSES SEKARANG</a>
    <div class="note">*Layanan berlangganan. Hentikan kapan saja.</div>
  </div>
  <div class="footer">Layanan premium. Perlu konfirmasi PIN. 18+</div>
</div>
</body>
</html>
